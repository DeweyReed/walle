apply plugin: 'com.android.library'
// apply from: rootProject.file("mt_maven.gradle")
// apply from: rootProject.file('quality.gradle')
apply plugin: 'maven-publish'

android {
    namespace 'com.meituan.android.walle'
    compileSdkVersion rootProject.ext.compileSdkVersion
    // buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    // buildTypes {
    //     debug {
    //         minifyEnabled false
    //         proguardFiles getDefaultProguardFile('proguard-android.txt')
    //     }
    //     release {
    //         minifyEnabled false
    //         proguardFiles getDefaultProguardFile('proguard-android.txt')
    //     }
    // }
    //
    // lintOptions {
    //     quiet true
    //     warningsAsErrors true
    //     disable 'GradleDependency'
    // }
}

// configurations.all {
//     resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
// }

dependencies {
    // implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.9.1'
    // implementation project(':payload_reader')
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.DeweyReed'
            artifactId = 'walle'
            version = 'useCommitReferenceInstead'

            afterEvaluate {
                from components.release
            }
        }
    }
}
